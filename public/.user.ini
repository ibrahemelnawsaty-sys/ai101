; Per-directory PHP limits for shared hosting with no root access (Article 10).
;
; WHY THIS FILE EXISTS
; upload_max_filesize and post_max_size are PHP_INI_PERDIR directives: the
; framework cannot raise them at runtime (ini_set() is a no-op for both), and
; .htaccess's "php_value" only works under mod_php, not the php-fpm/CGI setup
; Hostinger shared hosting actually uses. The documented fix (deploy/README.md
; §2.4) was to click them into hPanel's PHP Configuration by hand — a step
; with nothing in the repository to prove it was ever done, and nothing that
; re-applies it after Hostinger resets per-version PHP options on a PHP
; version change. Participants hit exactly that gap: the live limits stayed at
; the host's small defaults while the application went on promising up to 25
; MB per file, so every real hand-in — any deck past a few megabytes — was
; discarded by PHP before Laravel's own code ever ran, with no field to blame
; and no file saved (`project.errors.*` never fires: PHP empties $_POST and
; $_FILES first). A `.user.ini` in the web root is read by the PHP-FPM/CGI
; SAPI per directory with no hPanel step and no root, so the real ceiling
; ships with the code instead of living only in a control-panel click nobody
; can verify from the repository.
;
; Values matched to config/athar.php ('uploads.max_kilobytes' = 25600 KB,
; 'max_request_kilobytes' = 30720 KB) and to the support ticket ceiling
; (3 files x 10 MB, config/athar.php 'support.max_kilobytes'): post_max_size
; must clear the larger of the two plus multipart overhead (deploy/README.md
; §2.4; D-121, D-124's "تحتاج تأكيدًا قبل دفعة التذاكر" item 2).
;
; @see PRD §9.11.2, §12.5 · D-121, D-124 · CONSTITUTION Articles 7, 10

upload_max_filesize = 25M
post_max_size = 32M
max_file_uploads = 5
max_execution_time = 30
max_input_vars = 3000
memory_limit = 256M
