<title>أثر · واجهات المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   منصة أثر التدريبية — معرض الواجهات
   Design tokens: docs/00-source/PRD-AR-source.md §5
   Brand: brand/athar-brand-identity.png
   لا أصفر ولا ذهبي — بأي درجة — في أي مكان.
   ============================================================ */

:root{
  /* ---- الهوية (مقفلة) ---- */
  --violet-900:#3D2361;
  --violet-700:#5A3289;
  --violet-500:#7845B5;
  --violet-300:#B191D9;
  --violet-100:#EFE7F8;
  --violet-050:#F8F5FC;
  --teal-700:#017E80;
  --teal-500:#01AAAD;
  --teal-300:#5BC9CB;
  --teal-100:#E0F6F6;

  /* ---- حبر مائل للبنفسج: اختيار لا افتراض ---- */
  --ink-950:#08070C;
  --ink-900:#0D0B14;
  --ink-850:#110E1A;
  --ink-800:#16121F;
  --ink-700:#221B30;
  --ink-600:#2E2542;

  /* ---- محايد ---- */
  --n-900:#111114;
  --n-600:#5A5A66;
  --n-400:#9A9AA8;
  --n-200:#E4E4EB;
  --n-100:#F5F5F7;
  --n-000:#FFFFFF;

  /* ---- دلالي (مساحة ضيقة فقط) ---- */
  --ok:#0E9F6E;
  --warn:#C97A17;   /* برتقالي محروق — ليس ذهبيًا */
  --bad:#D64545;

  /* ---- مسافات ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
  --s8:32px; --s12:48px; --s16:64px; --s24:96px;

  /* ---- زوايا ---- */
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px; --r-full:9999px;

  /* ---- ظلال ---- */
  --sh-sm:0 1px 2px rgba(17,17,20,.05);
  --sh-md:0 4px 12px rgba(17,17,20,.08);
  --sh-lg:0 12px 32px rgba(17,17,20,.12);
  --sh-glow:0 0 0 1px rgba(120,69,181,.28), 0 18px 60px -18px rgba(120,69,181,.55);

  /* ---- حركة ---- */
  --t-fast:150ms; --t-base:200ms; --t-screen:300ms; --t-bar:800ms;
  --e-out:cubic-bezier(.22,.75,.28,1);
  --e-io:cubic-bezier(.65,.02,.28,1);

  --maxw:1240px;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--ink-950);
  color:#EDEAF3;
  font-family:var(--font);
  font-size:16px;
  line-height:1.75;
  direction:rtl;
  text-align:right;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}

h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit}
svg{display:block}

:focus-visible{outline:2px solid var(--violet-300);outline-offset:3px;border-radius:4px}

.u-num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   شريط المعرض العائم
   ============================================================ */
.gal{
  position:fixed;inset-block-end:20px;inset-inline:0;
  display:flex;justify-content:center;z-index:900;
  pointer-events:none;padding-inline:16px;
}
.gal__pill{
  pointer-events:auto;
  display:flex;align-items:center;gap:4px;
  padding:5px;border-radius:var(--r-full);
  background:rgba(13,11,20,.82);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(177,145,217,.24);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.gal__pill::-webkit-scrollbar{display:none}
.gal__b{
  padding:9px 18px;border-radius:var(--r-full);
  font-size:14px;font-weight:600;white-space:nowrap;
  color:#B9B2C9;transition:color var(--t-fast) var(--e-out),background var(--t-fast) var(--e-out);
  min-height:40px;
}
.gal__b:hover{color:#fff}
.gal__b[aria-selected="true"]{background:var(--violet-500);color:#fff}

/* ============================================================
   مسار الأثر — شريط تقدم جانبي بمحطات شيفرون
   ============================================================ */
.trace{
  position:fixed;inset-block:0;inset-inline-start:28px;
  width:26px;z-index:80;display:none;
  align-items:center;pointer-events:none;
}
@media(min-width:1180px){.trace{display:flex}}
.trace__rail{
  position:relative;inline-size:2px;block-size:min(62vh,560px);margin-inline:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.13),rgba(255,255,255,.05));
  border-radius:2px;
}
.trace__fill{
  position:absolute;inset-block-start:0;inset-inline:0;block-size:0%;
  background:linear-gradient(180deg,var(--violet-500),var(--teal-500));
  border-radius:2px;box-shadow:0 0 14px rgba(1,170,173,.55);
  transition:block-size 120ms linear;
}
.trace__stops{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between}
.trace__stop{
  pointer-events:auto;position:relative;inline-size:26px;block-size:26px;
  margin-inline-start:-12px;display:grid;place-items:center;cursor:pointer;
}
.trace__stop svg{inline-size:11px;block-size:11px;color:rgba(255,255,255,.26);transition:color var(--t-base) var(--e-out),transform var(--t-base) var(--e-out)}
.trace__stop:hover svg,.trace__stop.is-on svg{color:var(--teal-300);transform:scale(1.35)}
.trace__stop::after{
  content:attr(data-label);position:absolute;inset-inline-start:30px;
  font-size:11.5px;font-weight:600;color:#B9B2C9;white-space:nowrap;
  opacity:0;transform:translateX(6px);transition:opacity var(--t-base),transform var(--t-base);
}
.trace__stop:hover::after{opacity:1;transform:translateX(0)}

/* ============================================================
   الشعار
   ============================================================ */
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{block-size:26px;inline-size:auto}
.logo--sm svg{block-size:20px}
.logo--lg svg{block-size:40px}

/* ============================================================
   أزرار
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-block-size:44px;padding:0 22px;border-radius:var(--r-md);
  font-size:16px;font-weight:600;line-height:1;
  transition:transform var(--t-fast) var(--e-out),background var(--t-fast),box-shadow var(--t-fast),border-color var(--t-fast);
  position:relative;
}
.btn:active{transform:translateY(1px)}
.btn--pri{background:var(--violet-500);color:#fff;box-shadow:0 10px 30px -12px rgba(120,69,181,.9)}
.btn--pri:hover{background:#8850c6;box-shadow:0 16px 40px -14px rgba(120,69,181,1)}
.btn--sec{border:1.5px solid var(--violet-300);color:var(--violet-300);background:transparent}
.btn--sec:hover{background:rgba(177,145,217,.12);border-color:var(--violet-300)}
.btn--ghost{color:#C5BED4}
.btn--ghost:hover{color:#fff}
.btn--lg{min-block-size:54px;padding:0 30px;font-size:17px}
.btn--sm{min-block-size:36px;padding:0 14px;font-size:14px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* بريق يمر على الزر الأساسي عند المرور */
.btn--pri::after{
  content:"";position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);
  background-size:280% 100%;background-position:200% 0;
  transition:background-position 700ms var(--e-out);pointer-events:none;
}
.btn--pri:hover::after{background-position:-80% 0}

/* ============================================================
   الواجهة العامة — الترويسة
   ============================================================ */
.act{display:none}
.act.is-live{display:block}

.nav{
  position:sticky;inset-block-start:0;z-index:200;
  background:rgba(8,7,12,.72);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-block-end:1px solid rgba(255,255,255,.07);
}
.nav__in{
  max-inline-size:var(--maxw);margin-inline:auto;padding:0 24px;
  block-size:68px;display:flex;align-items:center;gap:28px;
}
.nav__links{display:none;gap:26px;margin-inline-end:auto;font-size:14.5px;font-weight:500}
@media(min-width:1024px){.nav__links{display:flex}}
.nav__links a{color:#B9B2C9;position:relative;padding-block:6px;transition:color var(--t-fast)}
.nav__links a:hover{color:#fff}
.nav__links a::after{
  content:"";position:absolute;inset-block-end:0;inset-inline:0;block-size:1.5px;
  background:var(--teal-500);transform:scaleX(0);transform-origin:right;
  transition:transform var(--t-base) var(--e-out);
}
.nav__links a:hover::after{transform:scaleX(1)}
.nav__cta{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
@media(max-width:1023px){.nav__cta{margin-inline-start:auto}}

/* ============================================================
   البنر الرئيسي
   ============================================================ */
.hero{position:relative;overflow:hidden;padding-block:var(--s24) var(--s16);isolation:isolate}
.hero__canvas{position:absolute;inset:0;z-index:-2;opacity:.5}
.hero__glow{
  position:absolute;z-index:-1;inset-block-start:-28%;inset-inline-end:-12%;
  inline-size:min(760px,105vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(120,69,181,.38),rgba(120,69,181,0) 62%);
  filter:blur(24px);pointer-events:none;
}
.hero__glow--2{
  inset-block-start:auto;inset-block-end:-34%;inset-inline-end:auto;inset-inline-start:-16%;
  inline-size:min(620px,95vw);
  background:radial-gradient(circle,rgba(1,170,173,.26),rgba(1,170,173,0) 62%);
}
.hero__in{max-inline-size:var(--maxw);margin-inline:auto;padding:0 24px;position:relative}

.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 15px 7px 13px;border-radius:var(--r-full);
  border:1px solid rgba(177,145,217,.3);background:rgba(120,69,181,.13);
  font-size:13px;font-weight:600;color:var(--violet-300);letter-spacing:.01em;
}
.eyebrow svg{inline-size:11px;block-size:11px;color:var(--teal-500)}

.hero h1{
  font-size:clamp(34px,6.4vw,68px);line-height:1.18;font-weight:700;
  margin-block:var(--s6) 0;letter-spacing:-.015em;max-inline-size:16ch;
}
.hero h1 .grad{
  background:linear-gradient(105deg,var(--violet-300) 0%,var(--teal-300) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero__sub{
  margin-block-start:var(--s6);font-size:clamp(16px,2vw,19px);
  color:#ADA5BD;max-inline-size:56ch;line-height:1.85;
}
.hero__chips{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:var(--s8)}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 15px;border-radius:var(--r-full);
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
  font-size:14px;font-weight:600;color:#DCD6E8;
}
.chip svg{inline-size:15px;block-size:15px;color:var(--teal-500)}
.hero__acts{display:flex;flex-wrap:wrap;gap:12px;margin-block-start:var(--s8);align-items:center}
.hero__note{font-size:13.5px;color:#8C8499}

/* عدّاد تنازلي */
.cd{
  margin-block-start:var(--s12);padding:var(--s6);border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);
  max-inline-size:520px;
}
.cd__hd{display:flex;align-items:center;gap:8px;font-size:13px;color:#A79FB8;font-weight:500}
.cd__dot{inline-size:7px;block-size:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(214,69,69,.6);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(214,69,69,.55)}70%{box-shadow:0 0 0 9px rgba(214,69,69,0)}100%{box-shadow:0 0 0 0 rgba(214,69,69,0)}}
.cd__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-block-start:var(--s4)}
.cd__cell{text-align:center;padding:12px 4px;border-radius:var(--r-md);background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.07)}
.cd__n{font-size:clamp(22px,4.6vw,30px);font-weight:700;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.cd__l{font-size:11.5px;color:#8C8499;margin-block-start:3px;font-weight:500}

/* المقاعد */
.seats{margin-block-start:var(--s6)}
.seats__row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:#A79FB8;margin-block-end:8px}
.seats__row b{color:#fff;font-weight:600}
.bar{block-size:8px;border-radius:var(--r-full);background:rgba(255,255,255,.09);overflow:hidden}
.bar__fill{block-size:100%;inline-size:0;border-radius:var(--r-full);background:linear-gradient(90deg,var(--violet-500),var(--teal-500));transition:inline-size var(--t-bar) var(--e-out)}

/* ============================================================
   أقسام عامة
   ============================================================ */
.sec{padding-block:var(--s24);position:relative}
.sec--pale{background:var(--n-000);color:var(--n-900)}
.sec--pale .lead{color:var(--n-600)}
.sec--tint{background:var(--violet-050);color:var(--n-900)}
.sec--tint .lead{color:var(--n-600)}
.wrap{max-inline-size:var(--maxw);margin-inline:auto;padding:0 24px}

.sec__hd{max-inline-size:60ch;margin-block-end:var(--s12)}
.sec__hd h2{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.01em;margin-block-start:var(--s4)}
.lead{margin-block-start:var(--s4);font-size:17px;color:#ADA5BD;line-height:1.85}

.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;letter-spacing:.09em;
  color:var(--teal-700);text-transform:none;
}
.sec:not(.sec--pale):not(.sec--tint) .kicker{color:var(--teal-300)}
.kicker svg{inline-size:10px;block-size:10px}

/* ============================================================
   شريط الثقة
   ============================================================ */
.trust{
  border-block:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);padding-block:var(--s8);
}
.trust__grid{display:grid;gap:var(--s6);grid-template-columns:repeat(2,1fr)}
@media(min-width:860px){.trust__grid{grid-template-columns:repeat(4,1fr)}}
.trust__i{text-align:center}
.trust__n{font-size:clamp(28px,4vw,38px);font-weight:700;color:#fff;line-height:1.2}
.trust__n .suf{color:var(--teal-500)}
.trust__l{font-size:13.5px;color:#8C8499;margin-block-start:2px}

/* ============================================================
   بطاقات
   ============================================================ */
.grid{display:grid;gap:var(--s6)}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}

.card{
  padding:var(--s6);border-radius:var(--r-lg);
  background:var(--n-000);border:1px solid var(--n-200);
  transition:transform var(--t-base) var(--e-out),box-shadow var(--t-base) var(--e-out),border-color var(--t-base);
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--violet-300)}
.card__ic{
  inline-size:44px;block-size:44px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--violet-100);color:var(--violet-500);margin-block-end:var(--s4);
}
.card__ic svg{inline-size:21px;block-size:21px}
.card h3{font-size:19px;margin-block-end:8px}
.card p{font-size:14.5px;color:var(--n-600);line-height:1.8}

.card--dark{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.09)}
.card--dark:hover{border-color:rgba(177,145,217,.42);box-shadow:var(--sh-glow)}
.card--dark p{color:#A79FB8}
.card--dark .card__ic{background:rgba(120,69,181,.2);color:var(--violet-300)}

/* الفئات المستهدفة — قائمة بشيفرون */
.who{display:grid;gap:var(--s3)}
.who__i{
  display:flex;gap:14px;align-items:flex-start;
  padding:18px 20px;border-radius:var(--r-md);
  background:var(--n-000);border:1px solid var(--n-200);
  transition:border-color var(--t-base),transform var(--t-base) var(--e-out);
}
.who__i:hover{border-color:var(--teal-500);transform:translateX(-4px)}
.who__ck{flex:none;inline-size:24px;block-size:24px;border-radius:var(--r-sm);background:var(--teal-100);color:var(--teal-700);display:grid;place-items:center;margin-block-start:2px}
.who__ck svg{inline-size:13px;block-size:13px}
.who__i b{display:block;font-size:16px;font-weight:600;color:var(--n-900)}
.who__i span{font-size:14.5px;color:var(--n-600)}

/* ماذا ستتعلم — أسابيع */
.wk{display:grid;gap:var(--s4)}
.wk__i{
  border:1px solid var(--n-200);border-radius:var(--r-lg);
  background:var(--n-000);overflow:hidden;
}
.wk__hd{display:flex;align-items:center;gap:16px;padding:20px var(--s6)}
.wk__no{
  flex:none;inline-size:46px;block-size:46px;border-radius:var(--r-md);
  display:grid;place-items:center;font-weight:700;font-size:15px;
  background:linear-gradient(135deg,var(--violet-500),var(--violet-700));color:#fff;
}
.wk__t{flex:1}
.wk__t b{display:block;font-size:18px;color:var(--n-900)}
.wk__t span{font-size:13.5px;color:var(--n-400)}
.wk__tags{padding:0 var(--s6) 22px;display:flex;flex-wrap:wrap;gap:8px}
.tag{
  padding:6px 13px;border-radius:var(--r-full);font-size:13px;font-weight:500;
  background:var(--violet-050);color:var(--violet-700);border:1px solid var(--violet-100);
}

/* الخط الزمني */
.tl{position:relative;padding-block-start:var(--s8)}
.tl__line{
  position:absolute;inset-block-start:calc(var(--s8) + 21px);inset-inline:0;block-size:2px;
  background:var(--n-200);display:none;
}
@media(min-width:900px){.tl__line{display:block}}
.tl__fill{block-size:100%;inline-size:0;background:linear-gradient(-90deg,var(--violet-500),var(--teal-500));transition:inline-size 1.4s var(--e-out)}
.tl__row{display:grid;gap:var(--s6);grid-template-columns:1fr;position:relative}
@media(min-width:900px){.tl__row{grid-template-columns:repeat(7,1fr);gap:var(--s3)}}
.tl__i{position:relative;padding-inline-start:52px}
@media(min-width:900px){.tl__i{padding-inline-start:0;text-align:center}}
.tl__dot{
  position:absolute;inset-block-start:0;inset-inline-start:9px;
  inline-size:24px;block-size:24px;border-radius:50%;
  background:var(--n-000);border:2px solid var(--n-200);
  display:grid;place-items:center;transition:all var(--t-screen) var(--e-out);
}
@media(min-width:900px){.tl__dot{position:relative;inset:auto;margin-inline:auto;margin-block-end:16px}}
.tl__dot svg{inline-size:11px;block-size:11px;color:transparent;transition:color var(--t-base)}
.tl__i.on .tl__dot{border-color:var(--teal-500);background:var(--teal-500);box-shadow:0 0 0 5px var(--teal-100)}
.tl__i.on .tl__dot svg{color:#fff}
.tl__i b{display:block;font-size:15px;color:var(--n-900);font-weight:600}
.tl__i span{font-size:13px;color:var(--n-400)}
/* الخط الرأسي على الجوال */
@media(max-width:899px){
  .tl__row::before{content:"";position:absolute;inset-block:12px;inset-inline-start:20px;inline-size:2px;background:var(--n-200)}
  .tl__i{padding-block-end:var(--s6)}
}

/* الشهادات */
.cert{
  padding:var(--s8);border-radius:var(--r-xl);position:relative;overflow:hidden;
  background:var(--n-000);border:1px solid var(--n-200);
}
.cert::before{
  content:"";position:absolute;inset-block-start:0;inset-inline:0;block-size:4px;
  background:linear-gradient(-90deg,var(--violet-500),var(--teal-500));
}
.cert__seal{
  inline-size:56px;block-size:56px;border-radius:var(--r-md);display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet-500),var(--violet-900));color:#fff;margin-block-end:var(--s4);
}
.cert__seal svg{inline-size:26px;block-size:26px}
.cert h3{font-size:21px;color:var(--n-900)}
.cert p{font-size:14.5px;color:var(--n-600);margin-block-start:10px;line-height:1.8}
.cert__meta{margin-block-start:var(--s6);padding-block-start:var(--s4);border-block-start:1px solid var(--n-200);font-size:13px;color:var(--n-400)}

/* المدربون */
.trainer{text-align:center;padding:var(--s6)}
.trainer__av{
  inline-size:88px;block-size:88px;border-radius:var(--r-full);margin-inline:auto;
  display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--violet-500),var(--teal-700));
  margin-block-end:var(--s4);box-shadow:0 12px 30px -12px rgba(120,69,181,.7);
}
.trainer b{display:block;font-size:17px;color:var(--n-900)}
.trainer span{display:block;font-size:13.5px;color:var(--violet-700);font-weight:600;margin-block-start:2px}
.trainer p{font-size:13.5px;color:var(--n-600);margin-block-start:10px;line-height:1.75}

/* الأسئلة الشائعة */
.faq{max-inline-size:820px;margin-inline:auto;display:grid;gap:10px}
.faq__i{border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);background:rgba(255,255,255,.03);overflow:hidden;transition:border-color var(--t-base)}
.faq__i[open]{border-color:rgba(177,145,217,.42);background:rgba(120,69,181,.08)}
.faq__q{
  padding:18px 22px;font-size:16px;font-weight:600;color:#EDEAF3;
  display:flex;align-items:center;gap:14px;cursor:pointer;list-style:none;min-block-size:44px;
}
.faq__q::-webkit-details-marker{display:none}
.faq__q svg{flex:none;inline-size:14px;block-size:14px;color:var(--teal-500);transition:transform var(--t-base) var(--e-out)}
.faq__i[open] .faq__q svg{transform:rotate(90deg)}
.faq__a{padding:0 22px 20px 52px;font-size:15px;color:#A79FB8;line-height:1.85}

/* الدعوة الأخيرة */
.final{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  padding:var(--s16) var(--s8);text-align:center;
  background:linear-gradient(135deg,var(--violet-700),var(--violet-900) 60%,var(--ink-800));
  border:1px solid rgba(177,145,217,.28);
}
.final::before{
  content:"";position:absolute;inset-block-start:-60%;inset-inline-start:-10%;
  inline-size:520px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(1,170,173,.3),transparent 65%);
}
.final__in{position:relative}
.final h2{font-size:clamp(26px,4vw,42px);color:#fff}
.final p{margin-block-start:var(--s4);font-size:17px;color:#D6CEE6;max-inline-size:52ch;margin-inline:auto}

/* التذييل */
.foot{border-block-start:1px solid rgba(255,255,255,.08);padding-block:var(--s12) var(--s8);background:var(--ink-900)}
.foot__grid{display:grid;gap:var(--s8);grid-template-columns:1fr}
@media(min-width:820px){.foot__grid{grid-template-columns:1.6fr 1fr 1fr}}
.foot h4{font-size:14px;color:#fff;margin-block-end:14px}
.foot li{margin-block-end:9px}
.foot a,.foot p{font-size:14px;color:#8C8499;transition:color var(--t-fast)}
.foot a:hover{color:var(--teal-300)}
.foot__bot{
  margin-block-start:var(--s12);padding-block-start:var(--s6);
  border-block-start:1px solid rgba(255,255,255,.07);
  display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;
  font-size:13px;color:#6E6880;
}

/* واتساب عائم */
.wa{
  position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:850;
  inline-size:54px;block-size:54px;border-radius:var(--r-full);
  display:grid;place-items:center;
  background:var(--teal-700);color:#fff;
  box-shadow:0 14px 34px -10px rgba(1,126,128,.85);
  transition:transform var(--t-base) var(--e-out);
}
.wa:hover{transform:scale(1.08)}
.wa svg{inline-size:26px;block-size:26px}

/* ============================================================
   ظهور تدريجي (لا يُستخدم داخل أول شاشة)
   ============================================================ */
.rv{opacity:0;transform:translateY(18px);transition:opacity 500ms var(--e-out),transform 500ms var(--e-out)}
.rv.in{opacity:1;transform:none}

/* ============================================================
   الفصل الثاني — داخل المنصة
   ============================================================ */
.stage{max-inline-size:1500px;margin-inline:auto;padding:var(--s12) 24px var(--s24)}
.stage__hd{margin-block-end:var(--s8);max-inline-size:70ch}
.stage__hd h2{font-size:clamp(24px,3.4vw,36px)}
.stage__hd p{margin-block-start:var(--s4);color:#ADA5BD;font-size:16px;line-height:1.85}

.stage__layout{display:grid;gap:var(--s6);grid-template-columns:1fr;align-items:start}
@media(min-width:1100px){.stage__layout{grid-template-columns:246px 1fr}}

.rail{
  position:sticky;inset-block-start:88px;
  border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);
  background:rgba(255,255,255,.028);padding:14px;
  max-block-size:calc(100vh - 130px);overflow-y:auto;
}
@media(max-width:1099px){.rail{position:static;max-block-size:none}}
.rail__g{margin-block-end:var(--s4)}
.rail__g:last-child{margin-block-end:0}
.rail__t{font-size:11px;font-weight:700;letter-spacing:.1em;color:#6E6880;padding:0 10px 8px}
.rail__b{
  display:flex;align-items:center;gap:10px;inline-size:100%;
  padding:9px 10px;border-radius:var(--r-sm);
  font-size:14px;font-weight:500;color:#B9B2C9;text-align:start;
  transition:background var(--t-fast),color var(--t-fast);min-block-size:38px;
}
.rail__b:hover{background:rgba(255,255,255,.05);color:#fff}
.rail__b[aria-current="true"]{background:rgba(120,69,181,.24);color:#fff;font-weight:600}
.rail__b i{
  flex:none;inline-size:6px;block-size:6px;border-radius:50%;
  background:transparent;border:1.5px solid rgba(255,255,255,.22);
}
.rail__b[aria-current="true"] i{background:var(--teal-500);border-color:var(--teal-500)}

/* إطار المتصفح */
.frame{
  border-radius:var(--r-lg);overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  background:var(--ink-800);
  box-shadow:0 40px 100px -40px rgba(0,0,0,.95);
}
.frame__bar{
  block-size:40px;display:flex;align-items:center;gap:8px;padding-inline:14px;
  background:var(--ink-700);border-block-end:1px solid rgba(255,255,255,.08);
}
.frame__dots{display:flex;gap:6px}
.frame__dots i{inline-size:10px;block-size:10px;border-radius:50%;background:rgba(255,255,255,.16)}
.frame__url{
  flex:1;max-inline-size:400px;margin-inline:auto;
  background:rgba(0,0,0,.36);border-radius:var(--r-full);
  padding:5px 14px;font-size:11.5px;color:#8C8499;text-align:center;
  direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.frame__body{background:var(--n-100);color:var(--n-900);min-block-size:600px;position:relative}
.frame__cap{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 4px 0;font-size:13px;color:#8C8499;
}
.frame__cap b{color:#B9B2C9;font-weight:600}
.frame__ids{display:flex;flex-wrap:wrap;gap:6px}
.idtag{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:var(--r-sm);
  background:rgba(120,69,181,.2);color:var(--violet-300);
  border:1px solid rgba(120,69,181,.32);direction:ltr;
}

/* ============================================================
   لوحة التحكم (داخل الإطار) — فاتحة
   ============================================================ */
.scr{display:none}
.scr.is-live{display:block}

.app{display:grid;grid-template-columns:1fr;min-block-size:600px}
@media(min-width:900px){.app{grid-template-columns:1fr 246px}}

.side{
  display:none;background:var(--n-000);
  border-inline-start:1px solid var(--n-200);
  padding:14px;
}
@media(min-width:900px){.side{display:block}}
.side__brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-block-end:1px solid var(--n-200);margin-block-end:12px}
.side__brand svg{block-size:18px;inline-size:auto}
.side__g{margin-block-end:14px}
.side__g+.side__g{padding-block-start:12px;border-block-start:1px solid var(--n-200)}
.side__b{
  display:flex;align-items:center;gap:11px;inline-size:100%;
  padding:9px 11px;border-radius:var(--r-sm);
  font-size:14px;color:var(--n-600);text-align:start;position:relative;min-block-size:40px;
  transition:background var(--t-fast),color var(--t-fast);
}
.side__b:hover{background:var(--n-100);color:var(--n-900)}
.side__b.on{background:var(--violet-100);color:var(--violet-700);font-weight:600}
.side__b.on::before{
  content:"";position:absolute;inset-inline-end:-14px;inset-block:6px;
  inline-size:3px;border-radius:2px;background:var(--violet-500);
}
.side__b svg{flex:none;inline-size:17px;block-size:17px}
.side__badge{
  margin-inline-start:auto;min-inline-size:20px;block-size:20px;padding-inline:6px;
  border-radius:var(--r-full);background:var(--violet-500);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;
}
.side__foot{margin-block-start:16px;padding:12px;border-radius:var(--r-md);background:var(--violet-050);border:1px solid var(--violet-100)}
.side__foot b{display:block;font-size:13px;color:var(--violet-900)}
.side__foot span{font-size:12px;color:var(--n-600)}

.main{background:var(--n-100);min-inline-size:0}
.top{
  block-size:64px;background:var(--n-000);border-block-end:1px solid var(--n-200);
  display:flex;align-items:center;gap:14px;padding-inline:20px;position:sticky;inset-block-start:0;z-index:20;
}
.top__t{font-size:15px;font-weight:600;color:var(--n-900)}
.top__t span{display:block;font-size:12px;color:var(--n-400);font-weight:400}
.top__r{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icb{
  inline-size:38px;block-size:38px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--n-600);position:relative;transition:background var(--t-fast),color var(--t-fast);
}
.icb:hover{background:var(--n-100);color:var(--n-900)}
.icb svg{inline-size:19px;block-size:19px}
.icb__d{position:absolute;inset-block-start:7px;inset-inline-start:8px;inline-size:8px;block-size:8px;border-radius:50%;background:var(--bad);border:2px solid var(--n-000)}
.av{
  inline-size:36px;block-size:36px;border-radius:var(--r-full);display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet-500),var(--teal-700));color:#fff;
  font-size:13px;font-weight:700;flex:none;
}
.av--lg{inline-size:64px;block-size:64px;font-size:22px}
.av--sm{inline-size:30px;block-size:30px;font-size:11px}

.body{padding:22px 20px 40px}
.body--tight{padding:18px 20px 30px}

/* بطاقات اللوحة */
.dgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.dgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1180px){.dgrid{grid-template-columns:repeat(3,1fr)}}
.dc{
  background:var(--n-000);border:1px solid var(--n-200);border-radius:var(--r-lg);
  padding:18px;transition:box-shadow var(--t-base),border-color var(--t-base);
}
.dc:hover{box-shadow:var(--sh-md)}
.dc__hd{display:flex;align-items:center;gap:9px;margin-block-end:14px}
.dc__hd h4{font-size:14px;font-weight:600;color:var(--n-900)}
.dc__hd svg{inline-size:16px;block-size:16px;color:var(--violet-500)}
.dc__hd a{margin-inline-start:auto;font-size:12.5px;color:var(--violet-700);font-weight:600}
.dc--span{grid-column:1/-1}
@media(min-width:700px){.dc--2{grid-column:span 2}}

.hello{
  grid-column:1/-1;padding:24px;border-radius:var(--r-lg);color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--violet-700),var(--violet-900) 55%,var(--ink-800));
}
.hello::after{
  content:"";position:absolute;inset-block-start:-70%;inset-inline-start:-6%;
  inline-size:300px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(1,170,173,.34),transparent 66%);
}
.hello__in{position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.hello h3{font-size:clamp(19px,2.6vw,26px)}
.hello p{font-size:14px;color:#D6CEE6;margin-block-start:6px}

.stat{display:flex;align-items:flex-start;gap:12px}
.stat__n{font-size:34px;font-weight:700;line-height:1.1;color:var(--n-900)}
.stat__n small{font-size:16px;color:var(--n-400);font-weight:600}
.stat__l{font-size:13px;color:var(--n-600);margin-block-start:2px}

.pbar{block-size:9px;border-radius:var(--r-full);background:var(--n-200);overflow:hidden;margin-block:12px 8px}
.pbar__f{block-size:100%;inline-size:0;border-radius:var(--r-full);background:linear-gradient(-90deg,var(--violet-500),var(--teal-500));transition:inline-size var(--t-bar) var(--e-out)}
.pbar--ok .pbar__f{background:var(--ok)}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--n-600)}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;
}
.pill svg{inline-size:11px;block-size:11px}
.pill--ok{background:var(--teal-100);color:var(--teal-700)}
.pill--go{background:#E4F7EF;color:#0B7A55}
.pill--wa{background:#FBF0E3;color:#9A5C10}
.pill--no{background:#FBE9E9;color:#B23434}
.pill--nu{background:var(--n-100);color:var(--n-600)}
.pill--pr{background:var(--violet-100);color:var(--violet-700)}
.pill--live{background:var(--violet-500);color:#fff;animation:live 1.9s infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(120,69,181,.6)}60%{box-shadow:0 0 0 7px rgba(120,69,181,0)}}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-block-end:1px solid var(--n-200)}
.row:last-child{border-block-end:0;padding-block-end:0}
.row:first-child{padding-block-start:0}
.row__m{flex:1;min-inline-size:0}
.row__m b{display:block;font-size:14px;font-weight:600;color:var(--n-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__m span{font-size:12.5px;color:var(--n-600)}
.row__e{flex:none;text-align:end}

.empty{text-align:center;padding:34px 18px}
.empty__ic{inline-size:52px;block-size:52px;border-radius:var(--r-full);background:var(--violet-050);color:var(--violet-300);display:grid;place-items:center;margin-inline:auto var(--s3);margin-inline:auto;margin-block-end:12px}
.empty__ic svg{inline-size:24px;block-size:24px}
.empty b{display:block;font-size:15px;color:var(--n-900)}
.empty p{font-size:13.5px;color:var(--n-600);margin-block-start:5px;max-inline-size:34ch;margin-inline:auto}

/* هيكل تحميل */
.sk{background:linear-gradient(90deg,var(--n-200) 25%,#EFEFF3 37%,var(--n-200) 63%);background-size:400% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ============================================================
   البطاقة الرقمية
   ============================================================ */
.idwrap{display:grid;gap:22px;grid-template-columns:1fr;align-items:start}
@media(min-width:1000px){.idwrap{grid-template-columns:minmax(0,420px) 1fr}}
.idscene{perspective:1100px}
.idcard{
  position:relative;border-radius:var(--r-xl);padding:24px;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#8A54C7 0%,var(--violet-700) 42%,var(--violet-900) 78%,#2A1745 100%);
  box-shadow:0 30px 70px -26px rgba(61,35,97,.85);
  transform-style:preserve-3d;transition:transform 240ms var(--e-out);
  aspect-ratio:1.586/1;min-block-size:250px;
}
.idcard__sheen{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 62%);
  transition:opacity var(--t-base);
}
.idscene:hover .idcard__sheen{opacity:1}
.idcard__grid{
  position:absolute;inset:0;opacity:.13;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(circle at 78% 12%,#000,transparent 62%);
  mask-image:radial-gradient(circle at 78% 12%,#000,transparent 62%);
}
.idcard__in{position:relative;block-size:100%;display:flex;flex-direction:column}
.idcard__top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.idcard__top svg{block-size:22px;inline-size:auto}
.idcard__prog{font-size:11.5px;color:#D8CFE9;text-align:end;line-height:1.6}
.idcard__mid{display:flex;align-items:center;gap:14px;margin-block-start:auto}
.idcard__name b{display:block;font-size:19px;font-weight:700;line-height:1.4}
.idcard__name span{display:block;font-size:12px;color:#C9BFDE;direction:ltr;text-align:right}
.idcard__bot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-block-start:16px}
.idcard__meta{font-size:11px;color:#C9BFDE;line-height:1.85}
.idcard__meta b{color:#fff;font-weight:600;font-size:11.5px}
.qr{
  inline-size:78px;block-size:78px;border-radius:9px;background:#fff;padding:5px;flex:none;
}
.qr svg{inline-size:100%;block-size:100%}

.idacts{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:18px}

/* ============================================================
   رحلتي — خط زمني رأسي
   ============================================================ */
.jn{position:relative;padding-inline-end:34px}
.jn::before{content:"";position:absolute;inset-block:16px 40px;inset-inline-end:13px;inline-size:2px;background:var(--n-200)}
.jn__f{position:absolute;inset-block-start:16px;inset-inline-end:13px;inline-size:2px;block-size:0;background:var(--teal-500);transition:block-size 1.2s var(--e-out)}
.jn__i{position:relative;padding-block-end:16px}
.jn__d{
  position:absolute;inset-block-start:14px;inset-inline-end:-34px;
  inline-size:28px;block-size:28px;border-radius:50%;
  background:var(--n-000);border:2px solid var(--n-200);
  display:grid;place-items:center;z-index:2;
}
.jn__d svg{inline-size:13px;block-size:13px;color:var(--n-400)}
.jn__b{
  background:var(--n-000);border:1px solid var(--n-200);border-radius:var(--r-md);
  padding:14px 16px;transition:border-color var(--t-base),box-shadow var(--t-base);
}
.jn__b b{font-size:14.5px;color:var(--n-900);display:block}
.jn__b span{font-size:12.5px;color:var(--n-600)}
.jn__i.done .jn__d{background:var(--teal-500);border-color:var(--teal-500)}
.jn__i.done .jn__d svg{color:#fff}
.jn__i.now .jn__d{background:var(--violet-500);border-color:var(--violet-500);animation:halo 2.2s infinite}
.jn__i.now .jn__d svg{color:#fff}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(120,69,181,.5)}60%{box-shadow:0 0 0 10px rgba(120,69,181,0)}}
.jn__i.now .jn__b{border-color:var(--violet-500);box-shadow:0 0 0 3px var(--violet-100)}
.jn__i.lock .jn__b{background:var(--n-100);border-style:dashed}
.jn__i.lock b,.jn__i.lock span{color:var(--n-400)}
.jn__x{margin-block-start:12px;padding-block-start:12px;border-block-start:1px solid var(--n-200);display:grid;gap:8px}
.jn__day{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--n-600)}
.jn__day b{font-size:13px;font-weight:500;color:var(--n-900)}

/* ============================================================
   الحضور
   ============================================================ */
.att{
  background:var(--n-000);border:1px solid var(--n-200);border-radius:var(--r-lg);
  padding:24px;text-align:center;
}
.att__ses{font-size:13px;color:var(--n-600)}

.checkin{

  min-block-size:58px;border-radius:var(--r-md);font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--violet-500);color:#fff;position:relative;overflow:hidden;
  transition:background var(--t-base),transform var(--t-fast);
}
.checkin[data-state="wait"]{background:var(--n-200);color:var(--n-400);cursor:not-allowed}

@keyframes pulse1{0%,100%{box-shadow:0 0 0 0 rgba(120,69,181,0)}50%{box-shadow:0 0 0 10px rgba(120,69,181,.22)}}

.checkin svg{inline-size:22px;block-size:22px}
.ck-path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 480ms var(--e-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.att__msg{margin-block-start:14px;font-size:14px;color:var(--n-600);min-block-size:22px}
.att__msg b{color:var(--ok)}

.atable{inline-size:100%;border-collapse:collapse;font-size:13.5px}

}
.atable td{padding:12px;border-block-end:1px solid var(--n-200);color:var(--n-900);vertical-align:middle}
.atable tr:last-child td{border-block-end:0}
.atable tbody tr{transition:background var(--t-fast)}
.atable tbody tr:hover{background:var(--violet-050)}
.tscroll{overflow-x:auto;border:1px solid var(--n-200);border-radius:var(--r-md);background:var(--n-000)}

/* ============================================================
   المهام والرفع
   ============================================================ */
.drop{
  border:2px dashed var(--n-200);border-radius:var(--r-lg);
  padding:32px 20px;text-align:center;background:var(--n-000);
  transition:border-color var(--t-base),background var(--t-base);cursor:pointer;
}
.drop:hover,.drop.hot{border-color:var(--teal-500);background:var(--teal-100)}
.drop__ic{inline-size:52px;block-size:52px;border-radius:var(--r-full);background:var(--violet-100);color:var(--violet-500);display:grid;place-items:center;margin:0 auto 12px}
.drop__ic svg{inline-size:24px;block-size:24px}
.drop b{display:block;font-size:15px;color:var(--n-900)}
.drop span{font-size:13px;color:var(--n-600)}
.up{margin-block-start:14px;background:var(--n-000);border:1px solid var(--n-200);border-radius:var(--r-md);padding:14px}
.up__hd{display:flex;align-items:center;gap:10px;font-size:13.5px}

.up__hd span{color:var(--n-600);font-size:12.5px}

/* احتفال */
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf i{position:absolute;inline-size:7px;block-size:11px;border-radius:1.5px;opacity:0;animation:fall 1.9s var(--e-out) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-12px) rotate(0)}100%{opacity:0;transform:translateY(340px) rotate(560deg)}}

/* ============================================================
   الدرجات
   ============================================================ */
.gtotal{

}
.gtotal__n{font-size:52px;font-weight:700;line-height:1}

.gtotal .bar{margin-block-start:16px;background:rgba(255,255,255,.16)}
.gitem{background:var(--n-000);border:1px solid var(--n-200);border-radius:var(--r-md);padding:16px}
.gitem__hd{display:flex;align-items:center;gap:10px;margin-block-end:10px}
.gitem__hd b{flex:1;font-size:14.5px;color:var(--n-900)}
.gitem__sc{font-size:17px;font-weight:700;color:var(--violet-700)}

.note{
  margin-block-start:12px;padding:12px 14px;border-radius:var(--r-sm);
  background:var(--violet-050);border-inline-start:3px solid var(--violet-300);
  font-size:13.5px;color:var(--n-600);line-height:1.8;
}
.note b{color:var(--violet-900);display:block;font-size:12.5px;margin-block-end:3px}

/* ============================================================
   التواصل
   ============================================================ */
.chat{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--n-200);border-radius:var(--r-lg);overflow:hidden;background:var(--n-000);min-block-size:470px}

.chat__list{display:none;border-inline-start:1px solid var(--n-200);background:var(--n-100);padding:10px}

.chat__ci{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--t-fast)}
.chat__ci:hover{background:var(--n-000)}
.chat__ci.on{background:var(--n-000);box-shadow:var(--sh-sm)}

.msg--in{background:var(--n-000);border:1px solid var(--n-200);border-start-end-radius:4px;align-self:flex-start;color:var(--n-900)}
.msg--out{background:var(--violet-500);color:#fff;border-start-start-radius:4px;align-self:flex-end}

.chat__in{padding:12px 14px;border-block-start:1px solid var(--n-200);display:flex;gap:10px;align-items:center;background:var(--n-000)}
.chat__in input{

.inp{
